<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>A rest — The Locrian Ensemble of London</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--nave:#07060B;--ivory:#F2E7D0;--flame:#E0A458;--smoke:#8E87A0;--hairline:rgba(224,164,88,.18)}
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:#6E2634;color:var(--ivory)}
  body{min-height:100svh;display:grid;place-items:center;background:var(--nave);color:var(--ivory);
    font-family:'Archivo',system-ui,sans-serif;text-align:center;padding:24px}
  main{display:grid;justify-items:center;gap:18px;max-width:34rem}
  .fermata{font-family:'Cormorant Garamond',serif;font-size:clamp(90px,24vw,150px);line-height:1;color:var(--flame)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,7vw,44px);line-height:1.1}
  h1 em{font-style:italic;color:var(--flame)}
  p{color:var(--smoke);font-size:15px;line-height:1.6;max-width:38ch}
  a.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;margin-top:10px;
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;text-decoration:none;
    border-radius:2px;background:var(--flame);color:var(--nave);transition:.3s}
  a.btn:hover{background:#FFE3AE}
  .num{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--smoke)}
</style>
</head>
<body>
<main>
  <div class="fermata" aria-hidden="true">𝄐</div>
  <h1>A rest — <em>this bar is silent.</em></h1>
  <p>The page you were listening for isn't in tonight's programme. It may have
    been moved, or it never existed. The music continues from the top.</p>
  <a class="btn" href="/">Return to the programme</a>
  <span class="num">404 · tacet</span>
</main>
</body>
</html>
